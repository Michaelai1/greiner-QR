<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Toolbox Talk</title>
<link rel="stylesheet" href="toolbox-talk.css?v=3">
</head>
<body class="tbt-app">
<div class="tbt-wrap" id="root">
  <p class="tbt-week">Loading…</p>
</div>
<script src="talks/library.js?v=4"></script>
<script src="toolbox-talk.js?v=4"></script>
<script>
(function () {
  'use strict';
  /* A Greiner employee's personal Toolbox Talk link: toolbox.html#<token>. The
     same Toolbox Talk component Peine uses (toolbox-talk.js), with Greiner's
     data. The token travels in the fragment, so it is never sent in a request
     line, an access log or a Referer. The server resolves it; an unknown,
     expired or revoked link gets the same "not available" page. No PIN: the
     personal link is the credential. */
  var URL_ = 'https://gvfolfzseqwhhimbxgjv.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2Zm9sZnpzZXF3aGhpbWJ4Z2p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxMzQzOTcsImV4cCI6MjA5OTcxMDM5N30.ZpJWG4a0evolcjxr36IDaA4o0pjRjw1cCGOWV9ofDE0';
  var TALKS = {                                                 // talk_key -> talk library entry
    'fall-protection': 'Fall Protection.pdf',
    'osha-ladder-safety-2026': 'OSHA Ladder Safety Requirements 2026.docx',
    'falls-from-ladder': 'Falls from Ladder.docx',
    'driver-safety-proper-positioning': 'Driver Safety: Proper Positioning',
    'cold-stress-slips-on-ice': 'Cold Stress - Talk 3 - Slips on Ice.docx',
    'hot-work-general-awareness': 'Hot Work - Talk 1 - General Awareness and Tips.docx',
    // Choice (Choice Mechanical) talks: keys start with "choice-" and open only on a Choice link.
    'choice-hot-work-talk1': 'Choice Toolbox Talk - Hot Work_Talk #1_General Awareness and Tips.docx'
  };
  /* Company isolation on the page as well as in the database: a Choice link only ever opens a Choice talk, and a
     link of any other company never opens a Choice talk. Anything else gets the "not available" page. */
  function talkAllowed(a) { return /^choice-/.test(a.talk_key || '') === (a.company === 'Choice'); }
  // A video talk is recorded as 'video'; anything else that is not 'doc' is 'guided'.
  function fmt(f) { return f === 'doc' ? 'doc' : f === 'video' ? 'video' : 'guided'; }
  var root = document.getElementById('root');
  var token = (location.hash || '').replace(/^#/, '').trim();
  var tt = null, A = null;

  function rpc(fn, body) {
    return fetch(URL_ + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.text().then(function (t) {
        var j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok) throw new Error('request failed');
        return j;
      });
    });
  }
  function refuse() {
    if (tt) { tt.stop(); tt = null; }
    root.innerHTML =
      '<h1 class="form-title">This link is not available</h1>' +
      '<p class="tbt-week">It may have expired, or it may have been replaced by a newer one.</p>' +
      '<div class="tbt-card"><p style="margin:0">Ask your supervisor for a new link.</p></div>';
  }
  window.addEventListener('hashchange', function () {
    var next = (location.hash || '').replace(/^#/, '').trim();
    if (!next || next === token) return;
    token = next; if (tt) { tt.stop(); tt = null; } A = null; load();
  });

  function load() {
    if (!token) { refuse(); return; }
    root.innerHTML = '<p class="tbt-week">Loading…</p>';
    rpc('cs_tbt_link_open', { p_token: token }).then(function (rows) {
      if (!Array.isArray(rows) || !rows.length) { refuse(); return; }
      A = rows[0];
      if (!talkAllowed(A)) { refuse(); return; }
      var lib = (window.TBT_LIBRARY || {})[TALKS[A.talk_key]] || null;
      if (!lib) { refuse(); return; }
      // A Guided Talk only entry has no pages: no format choice, no original.
      var guidedOnly = !!lib.guidedOnly;
      // A video entry ({ provider, id, seconds }) is played on this page instead.
      var talk = { title: A.talk_title, filename: lib.filename, weekStart: A.week_start,
        pages: (lib.pages || []).map(function (p) { return { src: 'talks/' + p.src, w: p.w, h: p.h }; }),
        sections: lib.sections || [], video: lib.video || null };
      var company = A.company || 'Greiner Brothers';
      if (A.already_done) {
        window.ToolboxTalk.renderRecorded(root, { talk: talk, company: company, submittedAt: A.submitted_at });
        return;
      }
      // A view-only copy (role 'observer', e.g. Choice's owner contact): the talk to read, nothing to record.
      // Opening it is logged as opened, never as attendance; the server also refuses any submit from it.
      if (A.role === 'observer') {
        tt = window.ToolboxTalk.mount(root, {
          talk: talk, company: company, employeeName: A.recipient_name, role: 'participant', viewOnly: true,
          viewOnlyNote: 'This is your copy of today\u2019s talk to read. View only: a supervisor records attendance for the crew.',
          defaultFormat: guidedOnly ? 'guided' : 'doc', guidedOnly: guidedOnly, pinRequired: false,
          submit: function () { return Promise.resolve(null); },
          progress: function (args) {
            rpc('cs_tbt_link_progress', { p_token: token, p_active_ms: Math.min(args.activeMs, 86400000),
              p_sections_viewed: args.sectionsViewed, p_format: fmt(args.format) }).catch(function () {});
          }
        });
        window.__greinerToolbox = { activeMs: function () { return tt ? tt.activeMs() : 0; } };
        return;
      }
      // The office decides who leads: a foreman link carries role 'leader' and
      // that job's crew. A foreman marks who attended and types in anyone missing.
      var leader = A.role === 'leader';
      var group = A.group_label || '';
      tt = window.ToolboxTalk.mount(root, {
        talk: talk, company: company, employeeName: A.recipient_name, role: leader ? 'leader' : 'participant',
        leadLabel: A.company === 'Choice' ? 'Supervisor-led group talk' : undefined,
        groups: leader && group ? [group] : [],
        roster: leader ? (A.roster || []).map(function (n) { return { n: n, g: group }; }) : [],
        defaultFormat: guidedOnly ? 'guided' : 'doc', guidedOnly: guidedOnly, pinRequired: false,
        submit: function (args) {
          var body = { p_token: token, p_active_ms: Math.min(args.activeMs, 86400000),
            p_format: fmt(args.format) };
          if (leader) body.p_group = { presenter: args.presenter, attendees: args.attendees, manual: args.manual };
          // A video talk reports its seconds played once more first, so the last few
          // seconds are not lost; if that fails, the submit still goes ahead.
          var first = args.format === 'video'
            ? rpc('cs_tbt_link_progress', { p_token: token, p_active_ms: body.p_active_ms,
                p_sections_viewed: args.sectionsViewed || 0, p_format: 'video' }).catch(function () { return null; })
            : Promise.resolve();
          return first.then(function () { return rpc('cs_tbt_link_submit', body); }).then(function (rows) {
            if (!Array.isArray(rows) || !rows.length) return null;
            A.already_done = true;
            return rows[0];
          });
        },
        progress: function (args) {
          if (!A || A.already_done) return;
          rpc('cs_tbt_link_progress', { p_token: token, p_active_ms: Math.min(args.activeMs, 86400000),
            p_sections_viewed: args.sectionsViewed, p_format: fmt(args.format) })
            .catch(function () {});
        }
      });
      window.__greinerToolbox = { activeMs: function () { return tt ? tt.activeMs() : 0; } };
    }).catch(refuse);
  }
  load();
})();
</script>
</body>
</html>
